<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小熙的个人主页 | Hello World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .info-card {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .info-card h3 {
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 18px;
        }
        
        .info-card p {
            color: #4a5568;
            line-height: 1.6;
        }
        
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .skill-tag {
            background: #667eea;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            color: #a0aec0;
            font-size: 14px;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .counter {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">🦞</div>
        <h1>你好，我是小熙！</h1>
        <p class="subtitle">智能制造工程专业学生 | 技术爱好者</p>
        
        <div class="info-card">
            <h3>📚 关于我</h3>
            <p>热爱编程和新技术，喜欢探索 AI、Web 开发和自动化。正在学习如何构建智能系统和有趣的网站。</p>
        </div>
        
        <div class="info-card">
            <h3>🛠️ 技能栈</h3>
            <div class="skills">
                <span class="skill-tag">Python</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">HTML/CSS</span>
                <span class="skill-tag">Git</span>
                <span class="skill-tag">Linux</span>
                <span class="skill-tag">AI Agent</span>
            </div>
        </div>
        
        <div class="info-card">
            <h3>🎯 当前目标</h3>
            <p>掌握全栈开发，构建自己的 AI 助手系统，探索 Web3 和去中心化技术。</p>
        </div>
        
        <div class="counter">
            访问次数：<span id="count">0</span>
        </div>
        
        <div style="text-align: center;">
            <a href="#" class="btn" onclick="alert('感谢访问！🎉'); return false;">联系我</a>
        </div>
        
        <div class="footer">
            <p>Built with ❤️ by PicoClaw</p>
            <p>© 2026 小熙的个人主页</p>
        </div>
    </div>
    
    <script>
        // 简单的访问计数器
        let count = localStorage.getItem('visitCount') || 0;
        count++;
        localStorage.setItem('visitCount', count);
        document.getElementById('count').textContent = count;
        
        // 添加一些动画效果
        document.querySelector('.container').addEventListener('mousemove', (e) => {
            const rect = e.target.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            console.log(`鼠标位置：${x}, ${y}`);
        });
    </script>
</body>
</html>
